spring:
  application:
    name: cicd-control-plane

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cicd}}
    username: ${POSTGRES_USER:cicd}
    password: ${POSTGRES_PASSWORD:cicd}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

execution:
  workspace:
    base-path: ${WORKSPACE_BASE_PATH:workspace}
    timeout-seconds: ${WORKSPACE_TIMEOUT:3600}
    max-retries: ${WORKSPACE_MAX_RETRIES:3}
    retry-enabled: ${WORKSPACE_RETRY_ENABLED:true}
    worker-id: ${WORKER_ID:worker-local}
    concurrency: ${WORKER_CONCURRENCY:1}
    prefetch: ${WORKER_PREFETCH:1}
  results:
    exchange: ${CICD_RESULTS_EXCHANGE:cicd.results.exchange}
    queue: ${CICD_RESULT_QUEUE:cicd.results}
    routing-key: ${CICD_RESULT_ROUTING_KEY:cicd.result}
  trigger:
    exchange: ${CICD_JOBS_EXCHANGE:cicd.jobs.exchange}
    routing-key: ${CICD_JOB_ROUTING_KEY:cicd.job.submitted}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

webhook:
  github:
    secret: ${WEBHOOK_GITHUB_SECRET:}
  gitlab:
    secret: ${WEBHOOK_GITLAB_SECRET:}
  max-payload-bytes: ${WEBHOOK_MAX_PAYLOAD_BYTES:1048576}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] [run=%X{runId:-} stage=%X{stageId:-} job=%X{jobId:-} attempt=%X{attemptId:-} worker=%X{workerId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.cicd.platform.controlplane: INFO
