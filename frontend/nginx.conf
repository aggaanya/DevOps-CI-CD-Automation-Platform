server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend proxy target is injected at container start via envsubst
    # (see /docker-entrypoint.d/20-envsubst-on-templates.sh). Set
    # BACKEND_INTERNAL_HOST to the backend's internal FQDN on Azure,
    # e.g. http://backend.internal.<eastus2>.azurecontainerapps.io.
    location /api/ {
        proxy_pass http://${BACKEND_INTERNAL_HOST};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}