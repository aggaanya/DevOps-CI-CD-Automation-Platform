# Phase 9 platform stack (live-reconstructed from the running Phase 9 stack):
#   React Frontend → Spring Boot Control Plane → PostgreSQL + RabbitMQ
#   + Worker, Redis, Keycloak (OIDC identity + RBAC)
#
# Reproduce with:
#   docker compose --build up -d --profile provision
#   docker compose --profile provision run --rm provision
#
# Tear down with:
#   docker compose down
#   Add -v to also remove named volumes.
#
# All services share one dedicated bridge network `cicd-local`.
# All credentials/ports come from environment variables
# (defaults in this file; real values optional via .env — see .env.example).
#
# Phase 9 auth notes:
#   * Keycloak advertises a stable frontend hostname (KC_HOSTNAME) so the
#     `iss` claim issued to browsers matches what the backend expects from
#     its discovery document.
#   * The backend discovers Keycloak on the internal Docker network but, per
#     the discovery document, fetches JWKS from the public issuer URL; the
#     backend `extra_hosts: localhost:host-gateway` mapping makes the public
#     loopback URL resolvable from inside the container (Docker Desktop).
#
# Host Ports:
#   Frontend             3000  (FRONTEND_PORT)
#   Backend              8081  (BACKEND_PORT)
#   Worker               8082  (WORKER_PORT)
#   Keycloak             8083  (KEYCLOAK_PORT)
#   RabbitMQ AMQP        5672  (RABBITMQ_AMQP_PORT)
#   RabbitMQ management  15672 (RABBITMQ_MGMT_PORT)
#   PostgreSQL           5432  (POSTGRES_PORT)
#   Redis                6379  (REDIS_PORT)

services:

  # ============================================================
  # RabbitMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    networks:
      - cicd-local

    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 12


  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:16-alpine
    networks:
      - cicd-local

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cicd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cicd}
      POSTGRES_DB: ${POSTGRES_DB:-cicd}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine
    networks:
      - cicd-local

    ports:
      - "${REDIS_PORT:-6379}:6379"

    command:
      [
        "redis-server",
        "--appendonly",
        "yes"
      ]

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 12


  # ============================================================
  # Keycloak
  # ============================================================
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    networks:
      - cicd-local

    # Host 8083 → Container 8080
    ports:
      - "${KEYCLOAK_PORT:-8083}:8080"

    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: dev-file
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      # Stable public issuer across every endpoint (tokens + discovery).
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8083}
      # Accept requests that arrive on the internal hostname too.
      KC_HOSTNAME_STRICT: "false"

    # Realm definition is imported once on first start; the `provision`
    # service below (--profile provision) bootstraps users/roles/passwords.
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

    command:
      [
        "start-dev",
        "--import-realm"
      ]

    healthcheck:
      # Image has bash+grep but no curl/wget.
      # Probe Keycloak management port 9000.
      test:
        [
          "CMD-SHELL",
          "bash -c \"exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'\""
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s


  # ============================================================
  # Keycloak provisioning (users + passwords + role mappings)
  # ============================================================
  provision:
    image: quay.io/keycloak/keycloak:25.0
    profiles:
      - provision
    networks:
      - cicd-local

    entrypoint:
      [
        "/bin/bash",
        "/opt/keycloak/provision.sh"
      ]

    depends_on:
      keycloak:
        condition: service_healthy

    environment:
      KC_SERVER: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      DEMO_ADMIN_USERNAME: ${DEMO_ADMIN_USERNAME:-admin@example.local}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin-password}
      DEMO_DEVELOPER_USERNAME: ${DEMO_DEVELOPER_USERNAME:-developer@example.local}
      DEMO_DEVELOPER_PASSWORD: ${DEMO_DEVELOPER_PASSWORD:-developer-password}
      DEMO_VIEWER_USERNAME: ${DEMO_VIEWER_USERNAME:-viewer@example.local}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD:-viewer-password}

    volumes:
      - ./keycloak/provision.sh:/opt/keycloak/provision.sh:ro


  # ============================================================
  # Spring Boot Control Plane
  # ============================================================
  backend:
    build:
      context: ./backend

    image: devops-ci-cd-automation-platform-backend

    networks:
      - cicd-local

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      keycloak:
        condition: service_healthy

    environment:
      # Spring Boot listens on container port 8081.
      SERVER_PORT: "8081"

      # PostgreSQL
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-cicd}
      POSTGRES_USER: ${POSTGRES_USER:-cicd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cicd}

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # JPA + Flyway — schema managed by Flyway migrations
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

      # Custom JwtDecoder (JwtDecoderConfig): JWKS fetched over the internal
      # Docker network, issuer enforced against the public Keycloak URL.
      CICD_JWT_JWKS_URI: http://keycloak:8080/realms/cicd-platform/protocol/openid-connect/certs
      CICD_JWT_ISSUER: http://localhost:8083/realms/cicd-platform

    # Host 8081 → Container 8081
    ports:
      - "${BACKEND_PORT:-8081}:8081"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8081/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s


  # ============================================================
  # React Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend

    networks:
      - cicd-local

    environment:
      # Injected into nginx.conf by envsubst at container start.
      BACKEND_INTERNAL_HOST: ${BACKEND_INTERNAL_HOST:-backend:8081}

    depends_on:
      backend:
        condition: service_healthy

    # Host 3000 → Nginx container port 80
    ports:
      - "${FRONTEND_PORT:-3000}:80"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1/"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # Worker
  # ============================================================
  worker:
    build:
      context: ./worker

    networks:
      - cicd-local

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # Worker identity
      WORKER_ID: ${WORKER_ID:-worker-docker}

      # Workspace
      WORKSPACE_ROOT: /data/workspaces

      # Foundation worker configuration
      WORKER_MAX_CONCURRENCY: "2"
      WORKER_SANDBOX: process
      WORKER_COMMAND_POLICY: STRICT
      WORKER_BUILD_IMAGE_ENABLED: "false"

      # Timeouts
      WORKER_COMMAND_TIMEOUT_MS: "900000"
      WORKER_MAX_PIPELINE_DURATION_MS: "1800000"

      # Retry configuration
      WORKER_RETRY_ENABLED: "true"
      WORKER_MAX_RETRIES: "3"
      WORKER_RETRY_DELAY_MS: "30000"

      # RabbitMQ topology
      CICD_JOBS_EXCHANGE: cicd.jobs.exchange
      CICD_RESULTS_EXCHANGE: cicd.results.exchange

      CICD_JOB_ROUTING_KEY: cicd.job.submitted
      CICD_DELAY_ROUTING_KEY: cicd.job.delay
      CICD_DEAD_ROUTING_KEY: cicd.job.dead
      CICD_RESULT_ROUTING_KEY: cicd.result

      CICD_JOB_QUEUE: cicd.jobs
      CICD_DELAY_QUEUE: cicd.jobs.delay
      CICD_DLQ: cicd.jobs.dlq

    # Host 8082 → Worker container 8080
    ports:
      - "${WORKER_PORT:-8082}:8080"

    volumes:
      - worker-workspaces:/data/workspaces

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "http://localhost:8080/actuator/health"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


# ==============================================================
# Network
# ==============================================================
networks:
  cicd-local:
    name: cicd-platform-local
    driver: bridge


# ==============================================================
# Persistent Volumes
# ==============================================================
volumes:
  rabbitmq-data:
  postgres-data:
  redis-data:
  worker-workspaces: